{{define "content"}}<main class="vk-main"><div class="vk-main__head"><h1>Projects</h1><span class="vk-muted vk-mono">{{len .Projects}}</span></div>
<div class="vk-list">{{if .Projects}}{{range .Projects}}<a class="vk-row" href="{{.Path}}"><span class="vk-row__name"><span>{{.Name}}</span><span class="vk-row__slug">{{.OrgSlug}} / {{.Slug}}</span></span><span class="vk-row__data">{{.Role}}</span></a>{{end}}{{else}}<div class="vk-empty"><h3>No projects</h3><p>You are not a member of any org yet. Ask an org admin to add you, or create one with <span class="vk-mono">vink admin</span> on the server.</p></div>{{end}}</div></main>{{end}}
