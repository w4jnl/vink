openapi: 3.1.0
info:
  title: vink API
  version: "1"
  description: |
    Heartbeat and uptime monitor. Authenticate with `Authorization: Bearer <api key>`;
    a key is scoped to one project. A browser session may use the same resources under
    `/api/v1/orgs/{org}/projects/{project}/…` with the `X-CSRF-Token` header on writes.
    Errors are RFC 7807 `application/problem+json`. Read-only keys get 403 on any non-GET.
    Every response carries `X-Request-Id`. Rate limit: 600 requests per minute per caller.
servers:
  - url: /api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors:
          type: array
          items: {type: object, properties: {field: {type: string}, msg: {type: string}}}
    Schedule:
      type: object
      description: Exactly one of period or cron.
      properties:
        period: {type: string, example: 1h}
        cron: {type: string, example: "0 3 * * *"}
    Confirm:
      type: object
      description: Retry a failed attempt before it counts.
      properties:
        retries: {type: integer, default: 2}
        delay: {type: string, default: 5s}
    ExpectBody:
      type: object
      properties:
        contains: {type: string}
        not_contains: {type: string}
        jsonpath:
          type: object
          properties:
            path: {type: string, example: $.status}
            equals: {}
    HTTPCheck:
      type: object
      required: [url]
      properties:
        url: {type: string}
        method: {type: string, default: GET, enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]}
        headers: {type: object, additionalProperties: {type: string}}
        body: {type: string}
        expect_status: {type: array, items: {oneOf: [{type: integer}, {type: string, example: 200-299}]}, default: [200-299]}
        expect_body: {$ref: "#/components/schemas/ExpectBody"}
        follow_redirects: {type: boolean, default: true}
        verify_tls: {type: boolean, default: true}
        ca_pem: {type: string, description: PEM certificates of a private CA}
    TCPCheck:
      type: object
      required: [host, port]
      properties:
        host: {type: string}
        port: {type: integer}
        send: {type: string}
        expect: {type: string, description: text the banner must contain}
    DNSCheck:
      type: object
      required: [name]
      properties:
        name: {type: string}
        type: {type: string, default: A, enum: [A, AAAA, CNAME, MX, NS, TXT, PTR, SRV]}
        resolver: {type: string, description: host or host:port; empty uses the system resolver}
        expect: {type: array, items: {type: string}}
    TLSCheck:
      type: object
      required: [host]
      properties:
        host: {type: string}
        port: {type: integer, default: 443}
        servername: {type: string}
        warn_days: {type: integer, default: 14, description: late inside this many days}
        crit_days: {type: integer, default: 3, description: down inside this many days}
    ICMPCheck:
      type: object
      required: [host]
      properties:
        host: {type: string}
        count: {type: integer, default: 3}
        loss_threshold: {type: number, default: 0.67}
    MaintenanceIn:
      type: object
      description: A one-off window has starts_at and ends_at; a weekly one has rrule (FREQ=WEEKLY;BYDAY=SA,SU), from and to as HH:MM in timezone (the project's when empty).
      required: [name]
      properties:
        name: {type: string}
        match_tags: {type: array, items: {type: string}, description: all-of; empty matches every monitor}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        rrule: {type: string, example: FREQ=WEEKLY;BYDAY=SU}
        from: {type: string, example: "02:00"}
        to: {type: string, example: "04:00"}
        timezone: {type: string}
    Maintenance:
      allOf:
        - $ref: "#/components/schemas/MaintenanceIn"
        - type: object
          properties:
            id: {type: string}
            active: {type: boolean}
            active_until: {type: string, format: date-time}
            next_start: {type: string, format: date-time}
            next_end: {type: string, format: date-time}
            ended_until: {type: string, format: date-time, description: set by end now on a weekly window}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    Diff:
      type: object
      description: One line per resource, such as "monitor api-health".
      properties:
        dry_run: {type: boolean}
        created: {type: array, items: {type: string}}
        updated: {type: array, items: {type: string}}
        recreated: {type: array, items: {type: string}}
        deleted: {type: array, items: {type: string}}
        unchanged: {type: array, items: {type: string}}
    StatusPageIn:
      type: object
      required: [slug, title]
      properties:
        slug: {type: string, description: unique across the instance; the page lives at /s/{slug}}
        title: {type: string}
        match_tags: {type: array, items: {type: string}, description: any-of; one group per tag in this order; empty shows every monitor}
        public: {type: boolean, default: true}
        password: {type: string, description: write-only; makes the page private; empty keeps the current one}
        custom_domain: {type: string}
    StatusPage:
      allOf:
        - $ref: "#/components/schemas/StatusPageIn"
        - type: object
          properties:
            id: {type: string}
            has_password: {type: boolean}
            url: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    MonitorIn:
      type: object
      description: Heartbeats take schedule, grace and the ping options; pull kinds take interval, timeout, confirm and their block.
      required: [slug]
      properties:
        slug: {type: string}
        name: {type: string}
        kind: {type: string, default: heartbeat, enum: [heartbeat, http, tcp, dns, tls, icmp]}
        tags: {type: array, items: {type: string}}
        schedule: {$ref: "#/components/schemas/Schedule"}
        timezone: {type: string}
        grace: {type: string, default: 5m}
        max_runtime: {type: string}
        failure_threshold: {type: integer, description: 1 for heartbeats, 3 for pull kinds}
        recovery_threshold: {type: integer, default: 1}
        methods: {type: array, items: {type: string, enum: [GET, POST, HEAD, PUT]}}
        body_limit: {type: integer}
        interval: {type: string, default: 60s}
        timeout: {type: string, default: 10s}
        confirm: {$ref: "#/components/schemas/Confirm"}
        location: {type: string, description: empty for a local check; agents arrive in phase 2}
        http: {$ref: "#/components/schemas/HTTPCheck"}
        tcp: {$ref: "#/components/schemas/TCPCheck"}
        dns: {$ref: "#/components/schemas/DNSCheck"}
        tls: {$ref: "#/components/schemas/TLSCheck"}
        icmp: {$ref: "#/components/schemas/ICMPCheck"}
    Monitor:
      allOf:
        - $ref: "#/components/schemas/MonitorIn"
        - type: object
          properties:
            id: {type: string}
            target: {type: string, description: what a pull monitor checks}
            state: {type: string, enum: [new, up, late, down, paused]}
            state_since: {type: string, format: date-time}
            last_obs_at: {type: [string, "null"], format: date-time}
            last_ok_at: {type: [string, "null"], format: date-time}
            next_due_at: {type: [string, "null"], format: date-time}
            expected_at: {type: [string, "null"], format: date-time}
            paused: {type: boolean}
            ping_url: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    Observation:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        source: {type: string}
        signal: {type: string, enum: [start, ok, fail, log, exit]}
        ok: {type: boolean}
        latency_ms: {type: [integer, "null"]}
        exit_code: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        run_id: {type: string}
        remote_addr: {type: string}
        user_agent: {type: string}
        has_body: {type: boolean}
        detail: {type: object}
    Event:
      type: object
      properties:
        id: {type: string}
        at: {type: string, format: date-time}
        from: {type: string}
        to: {type: string}
        reason: {type: string}
        observation_id: {type: string}
    Incident:
      type: object
      properties:
        id: {type: string}
        monitor: {type: string}
        monitor_name: {type: string}
        opened_at: {type: string, format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        acked_by: {type: string}
        acked_at: {type: [string, "null"], format: date-time}
        open: {type: boolean}
        reason: {type: string, description: the event reason that opened it}
    ChannelIn:
      type: object
      required: [name, kind, config]
      properties:
        name: {type: string}
        kind: {type: string, enum: [smtp, webhook, ntfy, gotify, matrix, slackhook, alertmanager]}
        config: {type: object, description: Kind-specific; secret fields are returned as "***" and "***" on update keeps the stored value.}
        enabled: {type: boolean, default: true}
    Channel:
      allOf:
        - $ref: "#/components/schemas/ChannelIn"
        - type: object
          properties:
            id: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    RouteIn:
      type: object
      required: [channels]
      properties:
        match_tags: {type: array, items: {type: string}, description: All-of; empty matches every monitor.}
        channels: {type: array, items: {type: string}, description: Channel ids; at least one.}
        on: {type: array, items: {type: string, enum: [down, up, late]}, default: [down, up]}
        repeat_every: {type: string, description: "0 or empty means never; otherwise at least 5m."}
        priority: {type: integer}
    Route:
      type: object
      properties:
        id: {type: string}
        match_tags: {type: array, items: {type: string}}
        channels: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, kind: {type: string}, enabled: {type: boolean}}}}
        on: {type: array, items: {type: string}}
        repeat_every: {type: string}
        priority: {type: integer}
    Key:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        access: {type: string, enum: [ro, rw]}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
        key: {type: string, description: Plaintext, only in the create response.}
    Status:
      type: object
      properties:
        counts: {type: object, additionalProperties: {type: integer}}
        total: {type: integer}
        open_incidents: {type: array, items: {$ref: "#/components/schemas/Incident"}}
        oldest_late_since: {type: [string, "null"], format: date-time}
        monitors: {type: array, items: {type: object}}
        generated_at: {type: string, format: date-time}
  parameters:
    slug: {name: slug, in: path, required: true, schema: {type: string}}
    id: {name: id, in: path, required: true, schema: {type: string}}
    limit: {name: limit, in: query, schema: {type: integer, maximum: 200, default: 50}}
    cursor: {name: cursor, in: query, schema: {type: string}, description: Opaque; take next_cursor from the previous page.}
paths:
  /me:
    get:
      summary: Caller identity
      responses: {"200": {description: Key prefix or user, org, project, role.}}
  /monitors:
    get:
      summary: List monitors sorted by name
      parameters:
        - {name: tag, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses: {"200": {description: Page of monitors.}}
    post:
      summary: Create a monitor
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MonitorIn"}}}}
      responses: {"201": {description: Created, with Location.}, "409": {description: Slug exists.}, "422": {description: Validation failed.}}
  /monitors/{slug}:
    parameters: [{$ref: "#/components/parameters/slug"}]
    get:
      summary: Get a monitor with state, next due time and ping URL
      responses: {"200": {description: The monitor.}, "404": {description: Unknown, or in another project.}}
    put:
      summary: Replace a monitor (slug and kind are immutable)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MonitorIn"}}}}
      responses: {"200": {description: Updated.}}
    patch:
      summary: Merge top-level fields into a monitor
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MonitorIn"}}}}
      responses: {"200": {description: Updated.}}
    delete:
      summary: Delete a monitor and its history
      responses: {"204": {description: Deleted.}}
  /monitors/{slug}/pause:
    parameters: [{$ref: "#/components/parameters/slug"}]
    post: {summary: Pause, responses: {"200": {description: The monitor.}}}
  /monitors/{slug}/resume:
    parameters: [{$ref: "#/components/parameters/slug"}]
    post: {summary: Resume with a fresh deadline, responses: {"200": {description: The monitor.}}}
  /maintenance:
    get: {summary: List maintenance windows, active first, responses: {"200": {description: "{items: [Maintenance]}"}}}
    post:
      summary: Add a window
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/MaintenanceIn"}}}}
      responses: {"201": {description: The window.}, "422": {description: Validation failed.}}
  /maintenance/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: One window, responses: {"200": {description: The window.}}}
    put:
      summary: Replace a window
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/MaintenanceIn"}}}}
      responses: {"200": {description: The window.}}
    delete: {summary: Delete a window, responses: {"204": {description: Deleted.}}}
  /maintenance/{id}/end:
    parameters: [{$ref: "#/components/parameters/id"}]
    post: {summary: End the running occurrence now, responses: {"200": {description: The window.}, "422": {description: The window is not active.}}}
  /apply:
    put:
      summary: Apply a declarative file to the project and return the diff
      description: The body is the apply file as YAML or JSON (docs/apply-schema.json). Everything applies in one transaction; monitor state is never touched; a monitor whose kind changes is recreated.
      parameters:
        - {name: dry_run, in: query, schema: {type: string, enum: ["1"]}, description: compute the diff and roll back}
        - {name: prune, in: query, schema: {type: string, enum: ["1"]}, description: delete monitors, channels and routes the file does not name}
      requestBody: {content: {application/yaml: {schema: {type: string}}, application/json: {schema: {type: object}}}}
      responses: {"200": {description: The diff.}, "422": {description: The file is not valid.}}
  /export:
    get:
      summary: The project as the apply YAML
      parameters: [{name: secrets, in: query, schema: {type: string, enum: ["1"]}, description: include channel secrets; needs edit rights}]
      responses: {"200": {description: application/yaml.}, "403": {description: Secrets asked for without edit rights.}}
  /status-pages:
    get: {summary: List status pages, responses: {"200": {description: "{items: [StatusPage]}"}}}
    post:
      summary: Add a status page
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/StatusPageIn"}}}}
      responses: {"201": {description: The page.}, "409": {description: The address is taken.}, "422": {description: Validation failed.}}
  /status-pages/{slug}:
    parameters: [{$ref: "#/components/parameters/slug"}]
    get: {summary: One status page, responses: {"200": {description: The page.}}}
    put:
      summary: Replace a status page
      requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/StatusPageIn"}}}}
      responses: {"200": {description: The page.}}
    delete: {summary: Delete a status page, responses: {"204": {description: Deleted.}}}
  /monitors/{slug}/check:
    parameters: [{$ref: "#/components/parameters/slug"}]
    post: {summary: Run a pull monitor's check now and return it, responses: {"200": {description: The monitor after the attempt.}, "422": {description: Not a pull monitor, or paused.}}}
  /monitors/{slug}/observations:
    parameters: [{$ref: "#/components/parameters/slug"}]
    get:
      summary: Observations, newest first
      parameters:
        - {name: since, in: query, schema: {type: string}, description: RFC 3339 or Unix seconds.}
        - {name: until, in: query, schema: {type: string}}
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses: {"200": {description: Page of observations.}}
  /monitors/{slug}/observations/{id}:
    parameters: [{$ref: "#/components/parameters/slug"}, {$ref: "#/components/parameters/id"}]
    get:
      summary: One observation; ?body=1 returns the stored body as text
      parameters: [{name: body, in: query, schema: {type: string, enum: ["1"]}}]
      responses: {"200": {description: The observation, or its body.}}
  /monitors/{slug}/events:
    parameters: [{$ref: "#/components/parameters/slug"}]
    get:
      summary: State flips, newest first
      parameters: [{$ref: "#/components/parameters/limit"}]
      responses: {"200": {description: Events.}}
  /incidents:
    get:
      summary: Incidents, open first
      parameters: [{name: open, in: query, schema: {type: string, enum: ["1"]}}, {$ref: "#/components/parameters/limit"}]
      responses: {"200": {description: Incidents.}}
  /incidents/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: One incident, responses: {"200": {description: The incident.}}}
  /incidents/{id}/ack:
    parameters: [{$ref: "#/components/parameters/id"}]
    post: {summary: Acknowledge an open incident (silences repeats), responses: {"200": {description: The incident.}, "409": {description: Already resolved.}}}
  /channels:
    get: {summary: List channels, responses: {"200": {description: Channels with secrets redacted.}}}
    post:
      summary: Create a channel (the first one also gets a default catch-all route)
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelIn"}}}}
      responses: {"201": {description: Created.}}
  /channels/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: One channel, responses: {"200": {description: The channel.}}}
    put:
      summary: Replace a channel
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ChannelIn"}}}}
      responses: {"200": {description: Updated.}}
    delete: {summary: Delete a channel and its routes, responses: {"204": {description: Deleted.}}}
  /channels/{id}/test:
    parameters: [{$ref: "#/components/parameters/id"}]
    post: {summary: Send a synthetic notification and return the error verbatim, responses: {"200": {description: Sent.}, "502": {description: The notifier failed; the body carries the error.}}}
  /routes:
    get: {summary: List routes by priority, responses: {"200": {description: Routes.}}}
    post:
      summary: Create a route
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RouteIn"}}}}
      responses: {"201": {description: Created.}}
  /routes/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    get: {summary: One route, responses: {"200": {description: The route.}}}
    put:
      summary: Replace a route
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/RouteIn"}}}}
      responses: {"200": {description: Updated.}}
    delete: {summary: Delete a route, responses: {"204": {description: Deleted.}}}
  /keys:
    get: {summary: List API keys (rw keys only), responses: {"200": {description: Keys.}}}
    post:
      summary: Create an API key; the plaintext is returned once
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {name: {type: string}, access: {type: string, enum: [ro, rw]}}}}}}
      responses: {"201": {description: Created.}}
  /keys/{id}:
    parameters: [{$ref: "#/components/parameters/id"}]
    delete: {summary: Revoke a key, responses: {"204": {description: Revoked.}}}
  /ping-key/rotate:
    post: {summary: Rotate the project ping key; the old key stays valid for the configured grace, responses: {"200": {description: The new key.}}}
  /status:
    get: {summary: Project summary: counts per state, open incidents, oldest late, responses: {"200": {description: Summary.}}}
