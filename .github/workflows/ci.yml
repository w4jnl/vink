name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: sqlc generate is clean
        run: |
          sqlc generate
          git diff --exit-code -- internal/db

      - name: tenancy gate
        run: scripts/check-tenancy.sh

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: test
        run: go test -race ./...

  # ping-py/ is the Python client: standard library only, Python 3.9 and
  # later. Its tests also run against a vink built from this commit.
  ping-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: build vink for the tests
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/vink" ./cmd/vink

      - name: no dependencies
        working-directory: ping-py
        run: |
          python - <<'EOF'
          import re, sys
          deps = re.search(r"^dependencies = \[(.*?)\]", open("pyproject.toml").read(), re.M | re.S)
          sys.exit("the Python client must stay on the standard library" if deps is None or deps.group(1).strip() else 0)
          EOF

      - name: lint and types
        if: matrix.python == '3.x'
        working-directory: ping-py
        run: |
          pipx run ruff==0.14.0 check .
          pipx run ruff==0.14.0 format --check .
          pipx run mypy==1.18.2

      - name: test
        working-directory: ping-py
        run: VINK_TEST_BINARY="$RUNNER_TEMP/vink" python -m unittest discover -s tests -v

      - name: installs from its directory
        run: |
          python -m pip install --quiet ./ping-py
          cd "$RUNNER_TEMP" && python -c "import vink_ping; print('vink_ping', vink_ping.__version__)"

  # ping/ is its own module with no dependencies and an older go line, so
  # projects on older Go can import it: lint it, and test it on the oldest
  # Go it declares as well as the current one.
  ping-module:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", stable]
    defaults:
      run:
        working-directory: ping
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        if: matrix.go == 'stable'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ping

      - name: no dependencies
        run: |
          if grep -q '^require' go.mod; then
            echo "the ping module must stay on the standard library"
            exit 1
          fi

      - name: test
        run: go test -race ./...
