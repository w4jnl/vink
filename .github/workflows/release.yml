name: release

# Every v* tag: goreleaser builds the binaries for linux, darwin and windows, writes
# sha256sums.txt and an SBOM per archive, builds the amd64 and arm64 images and the manifest
# at ghcr.io/w4jnl/vink, and creates the GitHub release with the notes from CHANGELOG.md.
# Needs no secret beyond GITHUB_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action/download-syft@v0
      - name: release notes from CHANGELOG.md
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '/^## /{p = ($2 == v)} p && !/^## /' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          test -s /tmp/notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes /tmp/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser has published with an empty body once; the notes are set here regardless
      - name: release notes on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --title "vink $GITHUB_REF_NAME" --notes-file /tmp/notes.md
