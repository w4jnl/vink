# goreleaser v2. `make tools` installs the pinned binary; `goreleaser check`
# validates this file and `goreleaser release --snapshot --clean` builds
# locally without publishing.
version: 2
project_name: vink

before:
  hooks:
    - go mod tidy
    - sh -c 'mkdir -p completions && for s in bash zsh fish powershell; do go run ./cmd/vink completion $s > completions/vink.$s; done'

builds:
  - id: vink
    main: ./cmd/vink
    binary: vink
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X github.com/w4jnl/vink/internal/version.Version={{.Version}}
      - -X github.com/w4jnl/vink/internal/version.Commit={{.ShortCommit}}
      - -X github.com/w4jnl/vink/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - docs/deploy/vink.service
      - docs/deploy/vink-agent.service
      - docs/deploy/vink.toml.example
      - docs/deploy/compose.yaml
      - docs/deploy/traefik-authelia.yaml
      - docs/deploy/apache-kerberos.conf
      - completions/*

checksum:
  name_template: sha256sums.txt

sboms:
  - artifacts: archive

dockers_v2:
  - id: vink
    dockerfile: Dockerfile
    images:
      - ghcr.io/w4jnl/vink
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: vink
      org.opencontainers.image.description: "Self-hosted heartbeat and uptime monitor; the same image runs the server, the probe agent and the CLI"
      org.opencontainers.image.source: https://github.com/w4jnl/vink
      org.opencontainers.image.version: "{{ .Version }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# ping/vX.Y.Z tags version the Go ping module in ping/, not vink: never
# take one for vink's version, nor as the previous release
git:
  ignore_tags:
    - "ping/*"

# release notes come from CHANGELOG.md: the release workflow passes them with
# --release-notes and sets them again after the upload, so this changelog is never used
changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
