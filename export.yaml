version: 1
project:
  slug: homelab
  name: homelab
  timezone: Europe/Amsterdam
channels:
  - {name: ntfy, kind: ntfy, token: '***', topic: vink, url: 'https://ntfy.example.com'}
maintenance:
  - name: weekly patching
    match_tags: [db]
    rrule: FREQ=WEEKLY;BYDAY=SU
    from: "02:00"
    to: "04:00"
    timezone: Europe/Amsterdam
monitors:
  - slug: cert
    name: Certificate
    kind: tls
    tags: [web]
    interval: 5m
    tls:
      host: vink.w4j.nl
  - slug: db
    name: Database
    kind: tcp
    tags: [db]
    interval: 30s
    tcp:
      host: 192.168.1.20
      port: 5432
  - slug: web
    name: Web app
    kind: http
    tags: [web]
    interval: 30s
    http:
      url: http://192.168.1.10:8000/health
      expect_body: {jsonpath: {path: $.status, equals: ok}}
status_pages:
  - slug: homelab
    title: Homelab status
    match_tags: [web, db]
