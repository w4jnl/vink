version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*database/sql.Rows).Close
        - (*github.com/w4jnl/vink/internal/db.DB).Close
    gosec:
      excludes:
        - G104 # duplicates errcheck
        - G115 # integer conversion overflow, too noisy for sizes and counts
        - G304 # reading files named by the operator's config is the point
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - noctx
    paths:
      - internal/db/.*\.sql\.go$
      - internal/db/models\.go$
      - internal/db/dbtx\.go$
      - internal/db/querier\.go$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/w4jnl/vink
