# Apache httpd in front of vink with Kerberos (SPNEGO) sign-in and AD
# groups: mod_auth_gssapi authenticates, mod_lookup_identity (via SSSD)
# supplies the groups, mod_headers passes both to vink with the shared
# secret, mod_proxy forwards. vink trusts the headers only from this
# host ([auth.proxy] trusted_cidrs) and only with the secret.
#
# Groups: vink reads Remote-Groups and maps names like vink:corp:admin
# to roles; AD groups usually arrive as plain names, so either create
# groups with those names or map them in vink.toml:
#   [auth.proxy]
#   group_map = { "Monitoring Admins" = "corp:admin", "Monitoring" = "corp:member" }
# strip_realm = true turns j@CORP.EXAMPLE into j.
#
# Required modules: proxy, proxy_http, proxy_wstunnel, headers, auth_gssapi,
# lookup_identity. Set VINK_PROXY_SECRET in /etc/sysconfig/httpd (or the
# unit's Environment=) and the same value for vink.

<VirtualHost *:443>
  ServerName vink.corp.example
  SSLEngine on
  SSLCertificateFile    /etc/pki/tls/certs/vink.corp.example.crt
  SSLCertificateKeyFile /etc/pki/tls/private/vink.corp.example.key

  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https"

  # The agent gateway is a WebSocket.
  ProxyPass        /agent/v1 ws://127.0.0.1:8080/agent/v1
  ProxyPassReverse /agent/v1 ws://127.0.0.1:8080/agent/v1
  ProxyPass        / http://127.0.0.1:8080/
  ProxyPassReverse / http://127.0.0.1:8080/

  <Location />
    AuthType GSSAPI
    AuthName "Corporate SSO"
    GssapiCredStore keytab:/etc/httpd/vink.keytab
    GssapiLocalName On                 # user@REALM -> user
    GssapiBasicAuth Off
    Require valid-user
    LookupUserGroups REMOTE_USER_GROUPS ","
    RequestHeader unset Remote-User early
    RequestHeader unset Remote-Groups early
    RequestHeader unset Remote-Email early
    RequestHeader unset Remote-Name early
    RequestHeader set Remote-User "%{REMOTE_USER}s"
    RequestHeader set Remote-Groups "%{REMOTE_USER_GROUPS}e"
    RequestHeader set X-Auth-Proxy-Secret "${VINK_PROXY_SECRET}"
  </Location>

  # Pings, the API, status pages, the agent gateway, metrics and health
  # take no browser identity: open at the proxy, and vink ignores identity
  # headers on these paths anyway.
  <LocationMatch "^/(ping|api|s|static|a|agent)/|^/(metrics|healthz|readyz)$">
    AuthType None
    Require all granted
    RequestHeader unset Remote-User early
    RequestHeader unset Remote-Groups early
    RequestHeader set X-Auth-Proxy-Secret "${VINK_PROXY_SECRET}"
  </LocationMatch>
</VirtualHost>

# vink.toml for this setup:
#   [server]
#   base_url = "https://vink.corp.example"
#   trusted_proxies = ["127.0.0.1/32"]
#   [auth.proxy]
#   enabled = true
#   trusted_cidrs = ["127.0.0.1/32"]
#   secret = "env:VINK_PROXY_SECRET"
#   strip_realm = true
#   default_org = "corp"                  # everyone signed in is a viewer in corp
#   [auth.local]
#   enabled = false                       # or keep on for break-glass
