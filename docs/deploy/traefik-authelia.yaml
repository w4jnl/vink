# Traefik dynamic configuration for vink behind Authelia (file provider).
#
# People reach the UI through Authelia's forward auth; Traefik passes the
# identity headers it returns plus a shared secret, and vink trusts them
# only from Traefik's address ([auth.proxy] trusted_cidrs) and only with
# the secret ([auth.proxy] secret, VINK_PROXY_SECRET on the vink side).
# Traefik's file provider does not expand ${VAR}; it runs Go templates,
# so the secret is written as {{ env "VINK_PROXY_SECRET" }} and Traefik
# must have that variable in its own environment.
# Pings, the API, status pages and their stylesheet under /static/, the
# one-click acknowledgement links under /a/, agents, metrics and health
# are open routes: no forward auth, and any identity header a client
# sent is stripped. Without /static/ a status page renders unstyled for
# anyone without an Authelia session; without /a/ the ack link in an
# alert bounces through the sign-in.
#
# Authelia access_control for the UI:
#   - domain: vink.example.com
#     policy: two_factor
#     subject: ["group:vink:homelab:admin", "group:vink:homelab:member"]
# Groups named vink:<org>:<role> grant that role; vink:admin grants
# instance admin. Set VINK_PROXY_SECRET in Traefik's environment too.
# To see why vink ignores the headers, run vink serve -d: it logs "proxy
# identity refused" with the reason (peer not trusted, wrong secret, no
# user header).
http:
  middlewares:
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        trustForwardHeader: true
        authResponseHeaders: [Remote-User, Remote-Groups, Remote-Email, Remote-Name]
    vink-secret:
      headers:
        customRequestHeaders: { X-Auth-Proxy-Secret: '{{ env "VINK_PROXY_SECRET" }}' }
    strip-identity:
      headers:
        customRequestHeaders: { Remote-User: "", Remote-Groups: "", Remote-Email: "", Remote-Name: "" }

  routers:
    vink-open:   # pings, API, status pages, static assets, ack links, agents, metrics, health: no forwardAuth, identity headers stripped
      rule: Host(`vink.example.com`) && (PathPrefix(`/ping/`) || PathPrefix(`/api/`) || PathPrefix(`/s/`) || PathPrefix(`/static/`) || PathPrefix(`/a/`) || PathPrefix(`/agent/`) || Path(`/metrics`) || Path(`/healthz`) || Path(`/readyz`))
      priority: 100
      entryPoints: [websecure]
      middlewares: [strip-identity, vink-secret]
      service: vink
      tls:
        certResolver: letsencrypt
    vink-ui:
      rule: Host(`vink.example.com`)
      entryPoints: [websecure]
      middlewares: [authelia, vink-secret]
      service: vink
      tls:
        certResolver: letsencrypt

  services:
    vink:
      loadBalancer:
        servers:
          - url: http://vink:8080
        # /agent/v1 is a WebSocket; Traefik upgrades it without extra config.

# vink.toml for this setup:
#   [server]
#   base_url = "https://vink.example.com"
#   trusted_proxies = ["172.16.0.0/12"]     # the docker network Traefik is on
#   [auth.proxy]
#   enabled = true
#   trusted_cidrs = ["172.16.0.0/12"]
#   secret = "env:VINK_PROXY_SECRET"
#   logout_url = "https://auth.example.com/logout?rd=https://vink.example.com"   # rd: where Authelia sends the person afterwards; without it they stay on its page
