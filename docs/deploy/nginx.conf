# vink behind nginx: one server block for each form of address. Use the one that matches
# server.base_url and delete the other. nginx forwards the path unchanged in both; vink does
# the rest. nginx does no sign-in on its own: keep vink's local accounts or OIDC for the UI,
# or add auth_request for the UI locations only (never for the open paths listed in
# docs/deploy.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- at its own hostname: base_url = "https://vink.example.com" ---------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name vink.example.com;
    # ssl_certificate     /etc/nginx/certs/vink.example.com.pem;
    # ssl_certificate_key /etc/nginx/certs/vink.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;       # /agent/v1 is a WebSocket
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1h;                                  # keep agent sockets open
        client_max_body_size 1m;                                # ping bodies are capped at 64 KB by vink
    }
}

# --- under a path on a shared host: base_url = "https://www.example.com/vink" ---------------
# proxy_pass without a URI keeps the request path as it is, so vink receives /vink/… and
# answers under it. Health probes use /vink/readyz.
server {
    listen 443 ssl;
    http2 on;
    server_name www.example.com;
    # ssl_certificate     /etc/nginx/certs/www.example.com.pem;
    # ssl_certificate_key /etc/nginx/certs/www.example.com.key;

    location = /vink { return 301 /vink/; }

    location /vink/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }
}

# vink.toml for either form:
#   [server]
#   base_url = "https://vink.example.com"        # or "https://www.example.com/vink"
#   trusted_proxies = ["127.0.0.1/32"]           # where nginx connects from
