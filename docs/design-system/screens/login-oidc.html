<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in with OIDC · vink</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
</head>
<body class="vk-app vk-app--fill">
<main class="vk-auth">
<div class="vk-auth__brand"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M8 3.2 H6 a2.2 2.2 0 0 0 -2.2 2.2 V18.6 a2.2 2.2 0 0 0 2.2 2.2 H8"/><path d="M16 3.2 H18 a2.2 2.2 0 0 1 2.2 2.2 V18.6 a2.2 2.2 0 0 1 -2.2 2.2 H16"/></g><path d="M7.5 10.1 L10.5 12.9 L16.5 7.1" stroke="currentColor" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="9.6" y="16.2" width="4.8" height="2.2" rx="1.1" fill="currentColor"/></svg><span>vink</span></div>
<form class="vk-auth__card" action="monitors.html" method="post">
<h1>Sign in</h1>
<a class="vk-btn vk-btn--primary vk-btn--block" href="monitors.html">Continue with Keycloak</a>
<p>You sign in at auth.w4j.nl and come straight back.</p>
<div class="vk-or" role="separator"><span>or use a local account</span></div>
<div class="vk-field"><label class="vk-field__label" for="username">Username</label><input class="vk-input" id="username" name="username" type="text" value="" placeholder="" autocomplete="username"></div>
<div class="vk-field"><label class="vk-field__label" for="password">Password</label><input class="vk-input" id="password" name="password" type="password" value="" placeholder="" autocomplete="current-password"></div>
<button type="submit" class="vk-btn vk-btn--block">Sign in</button>
<p>Local accounts are for break-glass and service users.</p>
</form>
<p class="vk-auth__foot">vink 0.4.1 · w4j.nl</p>
</main>
<script src="../components/bundle.js"></script>
<script>Vink.wire(document);</script>
</body>
</html>
