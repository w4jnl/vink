<form class="vk-auth__card" action="monitors.html" method="post">
<h1>Two-factor sign-in</h1>
<p>Enter the code from your authenticator app for <b>j</b>.</p>
<div class="vk-field vk-field--error"><label class="vk-field__label" for="otp">Code</label><input class="vk-input vk-input--otp" id="otp" name="otp" aria-describedby="otp-msg" aria-invalid="true" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" type="text" value="482913" placeholder=""><span class="vk-field__error" id="otp-msg"><i class="vk-glyph vk-glyph--down" aria-hidden="true"></i>That code didn’t work. Use the code on screen now; it changes every 30 seconds.</span></div>
<button type="submit" class="vk-btn vk-btn--primary vk-btn--block">Verify</button>
