<!doctype html>
<html>
<head><meta charset="utf-8"><title>vink</title></head>
<body>
<div id="root" class="vk-stack"></div>
<script>
  var V = window.Vink;
  document.getElementById('root').innerHTML = V.Panel({ title: 'Edit route 2', body:
    V.FieldRow({ fields: [V.Field({ id: 't', label: 'Tags', value: 'backup', mono: true, hint: 'A monitor needs all of them.' }), V.Field({ id: 'r', label: 'Repeat every', value: '0', mono: true, hint: '0 means never.' })] }),
    actions: V.Button({ label: 'Save route', variant: 'primary' }) + V.Button({ label: 'Cancel' }) + V.Button({ label: 'Delete route', variant: 'danger', confirm: 'Really delete?' }) });
  V.wire(document);
</script>
</body>
</html>
