<!doctype html>
<html>
<head><meta charset="utf-8"><title>vink</title></head>
<body>
<div id="root" class="vk-inline"></div>
<script>
  var V = window.Vink;
  document.getElementById('root').innerHTML = ['heartbeat','http','tcp','dns','tls','icmp'].map(function (k) { return '<span class="vk-state" style="color:var(--ink-muted)">' + V.KindIcon({ kind: k }) + k + '</span>'; }).join('');
  V.wire(document);
</script>
</body>
</html>
