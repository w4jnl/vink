<!doctype html>
<html>
<head><meta charset="utf-8"><title>vink</title></head>
<body>
<div id="root" class="vk-stack"></div>
<script>
  var V = window.Vink;
  document.getElementById('root').innerHTML =
    V.Notice({ tone: 'ok', title: 'Test sent.', text: 'The mail server accepted it: 250 2.0.0 OK.' }) +
    V.Notice({ tone: 'error', title: 'Test failed.', text: 'Alertmanager did not answer:', html: '<code>dial tcp 10.0.3.9:9093: connect: connection refused</code>' }) +
    V.Notice({ tone: 'info', title: 'Rotated.', text: 'The old ping key keeps working until tomorrow 14:12.' });
  V.wire(document);
</script>
</body>
</html>
