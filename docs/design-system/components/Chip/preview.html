<!doctype html>
<html>
<head><meta charset="utf-8"><title>vink</title></head>
<body>
<div id="root" class="vk-inline"></div>
<script>
  var V = window.Vink;
  document.getElementById('root').innerHTML = '<div class="vk-chips">' +
    V.Chip({ label: 'up', state: 'up', count: 11 }) + V.Chip({ label: 'late', state: 'late', count: 1 }) + V.Chip({ label: 'down', state: 'down', count: 1, pressed: true }) +
    V.Chip({ label: 'paused', state: 'paused', count: 1 }) + V.Chip({ label: 'prod', count: 9 }) + V.Chip({ label: 'backup', count: 3 }) + '</div>';
  V.wire(document);
</script>
</body>
</html>
