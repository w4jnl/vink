<!doctype html>
<html>
<head><meta charset="utf-8"><title>vink</title></head>
<body>
<div id="root" class="vk-stack"></div>
<script>
  var V = window.Vink;
  document.getElementById('root').innerHTML = '<div class="vk-checks">' + V.Checkbox({ label: 'Follow redirects', checked: true }) +
    V.Checkbox({ label: 'Verify the certificate', checked: true, hint: 'Off shows a warning on the monitor.' }) +
    ['late', 'down', 'up'].map(function (s) { return V.Checkbox({ labelHtml: V.StateBadge({ state: s }), checked: s !== 'late' }); }).join('') + '</div>';
  V.wire(document);
</script>
</body>
</html>
